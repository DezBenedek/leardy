<!doctype html>
<html lang="hu">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, theme-color=#059669"
		/>
		<meta name="description" content="Leardy — nyelvtanulás szókártyákkal, leckéről leckére, tanteremmel." />
		<meta name="theme-color" content="#059669" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..800&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				const t = localStorage.getItem('leardy-theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			} catch {
				/* private mode: marad világos */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
