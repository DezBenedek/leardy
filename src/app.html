<!doctype html>
<html lang="hu">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Leardy modern tanuló app leckékkel, szókártyákkal és tanteremmel." />
		<meta name="theme-color" content="#ffffff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Leardy" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				var t = localStorage.getItem('leardy-theme') || 'system';
				var dark =
					t === 'dark' ||
					(t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', dark ? '#0c0a09' : '#ffffff');
				// Megjelenési beállítások az első paint előtt (villanás ellen).
				var raw = localStorage.getItem('leardy-settings');
				if (raw) {
					var s = JSON.parse(raw);
					var fam = s && (s.fontFamily === 'modern' || s.fontFamily === 'book' || s.fontFamily === 'excalifont') ? s.fontFamily : 'system';
					document.documentElement.dataset.lefontfam = fam;
					if (s && s.reduceMotion) document.documentElement.classList.add('reduce-motion');
					if (s && s.compactList) document.documentElement.classList.add('compact');
				} else {
					document.documentElement.dataset.lefontfam = 'system';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
