name: leardy
description: Offline-first tanuló füzet — kártyák, streak, tanterem.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  fsrs: ^2.0.1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.20.2
  web_socket_channel: ^3.0.3
  collection: ^1.19.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
